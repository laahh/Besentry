{% load static %}
<!-- Page Header Start-->
<div class="page-main-header">
  <div class="main-header-right row m-0">
    <div class="main-header-left">
      <div class="logo-wrapper">
        <a class="brand-text" href="{% url 'dashboard:index' %}"><i data-feather="shield"></i><span>BeSentry</span></a>
      </div>
      <div class="dark-logo-wrapper">
        <a class="brand-text" href="{% url 'dashboard:index' %}"><i data-feather="shield"></i><span>BeSentry</span></a>
      </div>
      <div class="toggle-sidebar"><i class="status_toggle middle" data-feather="align-center" id="sidebar-toggle"></i></div>
    </div>
    <div class="left-menu-header col">
      <ul>
        <li>
          <form class="form-inline search-form">
            <div class="search-bg"><i class="fa fa-search"></i>
              <input class="form-control-plaintext" placeholder="Cari...">
            </div>
          </form><span class="d-sm-none mobile-search search-bg"><i class="fa fa-search"></i></span>
        </li>
      </ul>
    </div>
    <div class="nav-right col pull-right right-menu p-0">
      <ul class="nav-menus">
        <li><a class="text-dark" href="#!" onclick="toggleFullScreen()" title="Layar penuh"><i data-feather="maximize"></i></a></li>
        <li class="onhover-dropdown">
          <div class="notification-box"><i data-feather="bell"></i></div>
          <ul class="notification-dropdown onhover-show-div" id="notification-list">
            <li>
              <p class="f-w-700 mb-0">Notifikasi</p>
            </li>
            <li class="noti-empty">
              <p class="mb-0 text-muted">Belum ada notifikasi</p>
            </li>
          </ul>
        </li>
        <li>
          <div class="mode" title="Mode gelap"><i class="fa fa-moon-o"></i></div>
        </li>
        <li class="onhover-dropdown p-0">
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary-light"><i data-feather="log-out"></i>Keluar</button>
          </form>
        </li>
      </ul>
    </div>
    <div class="d-lg-none mobile-toggle pull-right w-auto"><i data-feather="more-horizontal"></i></div>
  </div>
</div>
<!-- Page Header Ends -->
