services:
  db:
    image: postgis/postgis:17-3.5
    container_name: besentry_db
    environment:
      POSTGRES_DB: besentry
      POSTGRES_USER: besentry
      POSTGRES_PASSWORD: besentry_dev
    ports:
      - "5433:5432"   # 5432 dipakai PostgreSQL 18 lokal Windows
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: besentry_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: besentry_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      # Di dalam jaringan compose, pakai nama service, bukan localhost
      DATABASE_URL: postgis://besentry:besentry_dev@db:5432/besentry
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app   # kode di-mount supaya runserver auto-reload
    depends_on:
      - db
      - redis

volumes:
  pgdata:
